[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pondllm"
version = "0.1.0"
description = "A small, reproducible ecology for inherited LLM adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.10",
  "bitsandbytes>=0.48",
  "datasets>=4",
  "peft>=0.18",
  "safetensors>=0.6",
  "torch>=2.8",
  "transformers>=5",
  "trl>=1",
]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
pondllm = "pondllm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

